{% extends "base.html" %}

{% block title %}Edit Service{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1><i class="fas fa-edit"></i> Edit Service</h1>
        <p>Update your service details</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-card max-width">
            <form method="POST" action="{{ url_for('edit_service', id=service.id) }}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Service Title <span class="required">*</span></label>
                        <input type="text" id="title" name="title" value="{{ service.title }}" required class="form-input">
                    </div>
                </div>

                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select id="category" name="category" required class="form-select">
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if service.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <select id="city" name="city" required class="form-select">
                            {% for c in cities %}
                            <option value="{{ c }}" {% if service.city == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price (MAD) <span class="required">*</span></label>
                        <input type="number" id="price" name="price" value="{{ service.price }}" required min="0" step="0.01" class="form-input">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="description">Description <span class="required">*</span></label>
                        <textarea id="description" name="description" rows="6" required class="form-textarea">{{ service.description }}</textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}>
                            <span class="checkmark"></span>
                            Service is active and visible
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="{{ url_for('my_services') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
